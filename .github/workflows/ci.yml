name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dr_politicians
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dr_politicians"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dr_politicians
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dr_politicians_test
      # CI-only placeholder; real secrets live in Vercel and .env.local.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql "$DATABASE_URL" -c "create database dr_politicians_test"
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
